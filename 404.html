<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Code Munk</title>
    <script>
      // GitHub Pages SPA redirect fix
      // When GitHub 404s a route, this script encodes the path into a query
      // param and redirects to index.html so the React app can handle it.
      var segmentCount = 1; // number of path segments in the repo name (/TCM = 1)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
